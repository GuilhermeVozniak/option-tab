name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Gate the release on the UI end-to-end suite: a broken overlay or preferences
  # flow must block the build/publish, not ship.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: Desktop UI e2e (overlay + preferences)
        run: cd apps/desktop/frontend && bunx playwright install --with-deps chromium && bun run e2e
      - name: Landing-page e2e
        run: cd apps/web && bun run build && bun run e2e

  build-desktop:
    needs: e2e
    strategy:
      fail-fast: false
      matrix:
        # platform/arch/format must stay aligned with the @option-tab/shared
        # release-asset contract (releaseAssetName), which the landing page
        # uses to build download links.
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: amd64
    runs-on: ${{ matrix.os }}
    env:
      # secrets are not readable in step-level `if:`; surface presence here.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: bun install --frozen-lockfile
      - name: Build frontend (embedded via //go:embed)
        run: cd apps/desktop/frontend && bun run build
      # The desktop binary is a plain `go build` (Wails v3 serves the embedded
      # frontend from the binary); macOS bundling/signing/notarization lives in
      # scripts/bundle.sh. Windows/Linux are stub-platform demo builds.
      - name: Build desktop binary (Windows)
        if: matrix.platform == 'windows'
        run: cd apps/desktop && go build -o build/bin/option-tab.exe .
      - name: Build desktop binary (Linux)
        if: matrix.platform == 'linux'
        run: cd apps/desktop && go build -o build/bin/option-tab .
      # Signing/notarization steps are skipped when the signing secrets are
      # absent (e.g. forks), so unsigned releases still build.
      - name: Import signing certificate (macOS)
        if: matrix.platform == 'darwin' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          # fail here, not at codesign, if the p12 lacks a Developer ID identity.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"
      - name: Enable signing for bundle.sh (macOS)
        if: matrix.platform == 'darwin' && env.HAS_MACOS_SIGNING == 'true'
        run: echo "CODESIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
      - name: Bundle, sign, and package dmg (macOS)
        if: matrix.platform == 'darwin'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh
      - name: Package artifact (Windows .zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd apps/desktop/build/bin
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path option-tab.exe -DestinationPath "option-tab_${version}_windows_${{ matrix.arch }}.zip"
      - name: Package artifact (Linux .tar.gz)
        if: matrix.platform == 'linux'
        run: |
          cd apps/desktop/build/bin
          tar -czf "option-tab_${GITHUB_REF_NAME#v}_linux_${{ matrix.arch }}.tar.gz" option-tab
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/build/bin/*.dmg
            apps/desktop/build/bin/*.zip
            apps/desktop/build/bin/*.tar.gz
