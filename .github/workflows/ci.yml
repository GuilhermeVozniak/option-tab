name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: cd apps/web && bunx playwright install --with-deps chromium && bun run e2e
      - run: cd apps/desktop/frontend && bun run e2e

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Install desktop system deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build frontend (main.go embeds frontend/dist)
        run: bun install --frozen-lockfile && cd apps/desktop/frontend && bun run build
      - run: cd apps/desktop && go test ./... -race -cover
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12
          working-directory: apps/desktop
