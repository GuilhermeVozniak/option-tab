version: "3"

tasks:
  default:
    cmds: [task --list]
  lint:
    desc: Lint all code (Biome + golangci-lint)
    cmds:
      - bun run lint
      - cd apps/desktop && golangci-lint run ./...
  test:
    desc: Run all unit/integration tests (Vitest + go test)
    cmds:
      - bun run test
      - cd apps/desktop && go test ./... -race -cover
  build:
    desc: Build web + desktop (frontend via turbo, then the Go binary with embedded assets)
    cmds:
      - ./scripts/generate-bindings.sh
      - bun run build
      - cd apps/desktop && MACOSX_DEPLOYMENT_TARGET=14.0 go build -o bin/option-tab .
  bundle:
    desc: Assemble the macOS .app bundle and dmg into apps/desktop/build/bin
    cmds:
      - ./scripts/bundle.sh
  bundle:unsigned:
    desc: Assemble an UNVERIFIED local macOS bundle (never distribute)
    cmds:
      - BUNDLE_MODE=unsigned ./scripts/bundle.sh
  e2e:
    desc: Run Playwright e2e (landing page + desktop UI)
    cmds:
      - cd apps/web && bunx playwright test
      - cd apps/desktop/frontend && bunx playwright test
  dev:web:
    desc: Run the landing page dev server
    cmds: [cd apps/web && bun run dev]
  dev:desktop:
    desc: Build the frontend, then run the desktop app in Wails v3 dev mode
    cmds:
      - ./scripts/generate-bindings.sh
      - cd apps/desktop/frontend && bun run build
      - cd apps/desktop && wails3 dev
